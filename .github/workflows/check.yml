name: Calculator checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: coffee_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: coffee_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_test -d coffee_market_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://coffee_test:local-ci-only@127.0.0.1:5432/coffee_market_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:widget
      - run: npm run build:portable
      - run: npm run db:postgres:check
      - run: npm run test:postgres
      - run: npm run build
      - name: Build migration and runtime container images
        run: |
          docker build --target migrator --tag coffee-market-migrator:ci .
          docker build --target runner --tag coffee-market-server:ci .
      - name: Verify isolated Compose deployment and Nginx rollback
        run: bash deploy/verify-compose.sh
      - name: Verify container migrations and application readiness
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          docker run --rm --network host --env DATABASE_URL coffee-market-migrator:ci
          docker run --detach --name coffee-market-ci --network host \
            --env DATABASE_URL --env SITE_ORIGIN=http://127.0.0.1:3000 coffee-market-server:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/api/health/ready; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs coffee-market-ci
            exit 1
          fi
      - name: Remove CI application container
        if: always()
        run: |
          if docker container inspect coffee-market-ci >/dev/null 2>&1; then
            docker rm --force coffee-market-ci
          fi

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit with redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  publish:
    name: Publish tested server images
    needs: [verify, secrets]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build immutable revision images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker build --target runner --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$registry/coffeemarket-calculator:$GITHUB_SHA" .
          docker build --target migrator --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$registry/coffeemarket-calculator-migrator:$GITHUB_SHA" .
      - name: Publish to the repository's container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$registry/coffeemarket-calculator:$GITHUB_SHA"
          docker push "$registry/coffeemarket-calculator-migrator:$GITHUB_SHA"
          docker logout ghcr.io
